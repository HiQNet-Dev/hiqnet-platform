name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hiqnet
          POSTGRES_PASSWORD: hiqnet_dev
          POSTGRES_DB: hiqnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiqnet -d hiqnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Usar toolchain fijada en rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Crear base efímera de pruebas
        run: |
          PGPASSWORD=hiqnet_dev psql -h localhost -U hiqnet -d postgres -c 'CREATE DATABASE hiqnet_test'
          PGPASSWORD=hiqnet_dev psql -h localhost -U hiqnet -d postgres -c 'CREATE DATABASE hiqnet_upgrade_test'
          PGPASSWORD=hiqnet_dev psql -h localhost -U hiqnet -d postgres -c 'CREATE DATABASE hiqnet_auth_upgrade_test'
      - name: Pruebas del workspace y migraciones en BD aislada
        run: cargo test --workspace
        env:
          TEST_DATABASE_URL: postgres://hiqnet:hiqnet_dev@localhost:5432/hiqnet_test
          TEST_UPGRADE_DATABASE_URL: postgres://hiqnet:hiqnet_dev@localhost:5432/hiqnet_upgrade_test
          TEST_AUTH_UPGRADE_DATABASE_URL: postgres://hiqnet:hiqnet_dev@localhost:5432/hiqnet_auth_upgrade_test
      - name: Backup y restore sintético en otra base
        env:
          PGPASSWORD: hiqnet_dev
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}')"
          test -n "$postgres_container"
          psql -h localhost -U hiqnet -d hiqnet_test -v ON_ERROR_STOP=1 -c \
            "INSERT INTO organization (id, display_name, status, created_at) VALUES ('00000000-0000-4000-8000-000000000002', 'synthetic-ci', 'active', now())"
          psql -h localhost -U hiqnet -d hiqnet_test -v ON_ERROR_STOP=1 -c \
            "INSERT INTO installation (id, organization_id, device_label, status, registered_at) VALUES ('00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000002', 'synthetic-ci', 'active', now())"
          docker exec "$postgres_container" pg_dump -U hiqnet -d hiqnet_test -Fc -f /tmp/hiqnet-ci.dump
          psql -h localhost -U hiqnet -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE hiqnet_restore'
          docker exec "$postgres_container" pg_restore --exit-on-error -U hiqnet -d hiqnet_restore /tmp/hiqnet-ci.dump
          test "$(psql -h localhost -U hiqnet -d hiqnet_restore -Atc "SELECT count(*) FROM installation WHERE device_label = 'synthetic-ci'")" = 1
      - name: Validar OpenAPI 3.1 y snapshot generado desde router
        run: |
          set -euo pipefail
          python3 -m venv /tmp/hiqnet-openapi-venv
          /tmp/hiqnet-openapi-venv/bin/python -m pip install openapi-spec-validator==0.9.0
          /tmp/hiqnet-openapi-venv/bin/python -m openapi_spec_validator --schema 3.1 openapi/openapi.json
          cargo run --quiet -p hiqnet-platform-api --bin generate-openapi > /tmp/hiqnet-openapi.json
          cmp openapi/openapi.json /tmp/hiqnet-openapi.json
      - name: Validar SemVer sin publicar
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  control-center:
    name: Control Center (lint, typecheck, test, build, api, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Instalar dependencias del workspace
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, tests, build y contrato OpenAPI
        run: |
          pnpm control:lint
          pnpm control:typecheck
          pnpm control:test
          pnpm control:build
          pnpm control:api:check
      - name: Instalar Chromium para E2E
        run: pnpm --filter @hiqnet/control-center exec playwright install --with-deps chromium
      - name: E2E crítico del Control Center
        run: pnpm --filter @hiqnet/control-center e2e

  portal:
    name: Portal (lint, tipos, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Instalar dependencias del workspace
        run: pnpm install --frozen-lockfile
      - name: Cliente OpenAPI sin drift
        run: pnpm portal:api:check
      - name: Lint
        run: pnpm portal:lint
      - name: Formato
        run: pnpm portal:format:check
      - name: Tipos
        run: pnpm portal:typecheck
      - name: Tests
        run: pnpm portal:test
      - name: Build
        run: pnpm portal:build

  supply-chain:
    name: Archivos prohibidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos prohibidos y claves privadas
        run: python3 scripts/check_repository.py

  portal-e2e:
    name: Portal E2E full-stack
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hiqnet
          POSTGRES_PASSWORD: hiqnet_dev
          POSTGRES_DB: hiqnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiqnet -d hiqnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Usar toolchain fijada en rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Compilar API y bootstraps
        run: cargo build -p hiqnet-platform-api --bin hiqnet-platform-api --bin dev-bootstrap-account --bin dev-bootstrap-staff
      - name: Crear base E2E
        env:
          PGPASSWORD: hiqnet_dev
        run: psql -h localhost -U hiqnet -d postgres -c 'CREATE DATABASE hiqnet_e2e'
      - name: Arrancar API
        env:
          DATABASE_URL: postgres://hiqnet:hiqnet_dev@localhost:5432/hiqnet_e2e
          HIQNET_PLATFORM_ENV: development
          HIQNET_PLATFORM_COOKIE_SECURE: "false"
          HIQNET_PLATFORM_ALLOWED_ORIGIN: http://127.0.0.1:5173,http://127.0.0.1:5174
          HIQNET_PLATFORM_ENABLE_DOCS: "true"
          PORT: "8080"
        run: |
          nohup target/debug/hiqnet-platform-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - name: Bootstrap de cuentas E2E
        env:
          DATABASE_URL: postgres://hiqnet:hiqnet_dev@localhost:5432/hiqnet_e2e
          HIQNET_PLATFORM_ENV: development
          HIQNET_PLATFORM_DEV_BOOTSTRAP: "true"
          HIQNET_PLATFORM_DEV_STAFF_BOOTSTRAP: "true"
        run: |
          printf 'PortalE2E-2026!\n' | target/debug/dev-bootstrap-account portal-e2e@example.test 'Portal E2E'
          printf 'StaffE2E-2026!\n' | target/debug/dev-bootstrap-staff staff-e2e@hiqnet.test 'Staff E2E' platform_admin
          printf 'ReadOnlyE2E-2026!\n' | target/debug/dev-bootstrap-staff staff-readonly-e2e@hiqnet.test 'Staff ReadOnly E2E' read_only
      - name: Sembrar organización/producto para F02
        env:
          PGPASSWORD: hiqnet_dev
        run: |
          psql -h localhost -U hiqnet -d hiqnet_e2e -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO product (id,key,name,description,status,product_type,created_at,updated_at)
          VALUES (gen_random_uuid(),'pos','HiQNet POS','Producto sintético E2E','active','desktop',now(),now());
          INSERT INTO organization (id,display_name,status,created_at)
          VALUES ('11111111-1111-4111-8111-111111111111','Enrollment E2E Base','active',now());
          INSERT INTO organization_membership (organization_id,account_id,role,role_version,joined_at)
          SELECT '11111111-1111-4111-8111-111111111111', id, 'owner', 1, now()
          FROM commercial_account WHERE email='portal-e2e@example.test';
          INSERT INTO organization_product (organization_id,product_id,status,activated_at)
          SELECT '11111111-1111-4111-8111-111111111111', id, 'active', now()
          FROM product WHERE key='pos';
          SQL
      - name: Instalar Chromium
        run: pnpm --filter @hiqnet/platform-portal exec playwright install --with-deps chromium
      - name: Arrancar Portal
        run: |
          nohup pnpm --filter @hiqnet/platform-portal dev > /tmp/portal.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portal.log
          exit 1
      - name: E2E full-stack
        env:
          PORTAL_E2E_EMAIL: portal-e2e@example.test
          PORTAL_E2E_PASSWORD: PortalE2E-2026!
          PLATFORM_STAFF_EMAIL: staff-e2e@hiqnet.test
          PLATFORM_STAFF_PASSWORD: StaffE2E-2026!
        run: pnpm --filter @hiqnet/platform-portal e2e --reporter=line
      - name: Instalar Chromium para el Control Center
        run: pnpm --filter @hiqnet/control-center exec playwright install --with-deps chromium
      - name: E2E full-stack del Control Center (5 viewports)
        env:
          PLATFORM_STAFF_EMAIL: staff-e2e@hiqnet.test
          PLATFORM_STAFF_PASSWORD: StaffE2E-2026!
          PLATFORM_READONLY_EMAIL: staff-readonly-e2e@hiqnet.test
          PLATFORM_READONLY_PASSWORD: ReadOnlyE2E-2026!
        run: pnpm --filter @hiqnet/control-center exec playwright test e2e/full-stack.spec.ts --reporter=line
