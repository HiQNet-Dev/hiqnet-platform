name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hiqnet
          POSTGRES_PASSWORD: hiqnet_dev
          POSTGRES_DB: hiqnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiqnet -d hiqnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Usar toolchain fijada en rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Crear base efímera de pruebas
        run: PGPASSWORD=hiqnet_dev psql -h localhost -U hiqnet -d postgres -c 'CREATE DATABASE hiqnet_test'
      - name: Pruebas del workspace y migraciones en BD aislada
        run: cargo test --workspace
        env:
          TEST_DATABASE_URL: postgres://hiqnet:hiqnet_dev@localhost:5432/hiqnet_test
      - name: Backup y restore sintético en otra base
        env:
          PGPASSWORD: hiqnet_dev
        run: |
          set -euo pipefail
          psql -h localhost -U hiqnet -d hiqnet_test -v ON_ERROR_STOP=1 -c \
            "INSERT INTO installation (id, organization_id, device_label, status, registered_at) VALUES ('00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000002', 'synthetic-ci', 'active', now())"
          pg_dump -h localhost -U hiqnet -d hiqnet_test -Fc -f /tmp/hiqnet-ci.dump
          psql -h localhost -U hiqnet -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE hiqnet_restore'
          pg_restore --exit-on-error -h localhost -U hiqnet -d hiqnet_restore /tmp/hiqnet-ci.dump
          test "$(psql -h localhost -U hiqnet -d hiqnet_restore -Atc "SELECT count(*) FROM installation WHERE device_label = 'synthetic-ci'")" = 1
      - name: Validar OpenAPI
        run: python3 -c "import json; d=json.load(open('openapi/openapi.json')); assert d['openapi'].startswith('3.1'); assert '/health' in d['paths'] and '/ready' in d['paths']; print('openapi ok')"
      - name: Validar SemVer sin publicar
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  supply-chain:
    name: Archivos prohibidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos prohibidos y claves privadas
        run: python3 scripts/check_repository.py
