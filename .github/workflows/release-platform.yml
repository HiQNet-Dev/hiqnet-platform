name: Release Platform

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión SemVer para simulación (ej. 0.2.0-rc.1); no publica"
        required: true
  push:
    tags:
      - "platform-v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validar referencia y versión
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar SemVer y versión del workspace
        id: version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/validate_release.py >> "$GITHUB_OUTPUT"

  rust:
    name: Validación Rust
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hiqnet
          POSTGRES_PASSWORD: hiqnet_dev
          POSTGRES_DB: hiqnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiqnet -d hiqnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Usar toolchain fijada en rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Crear base efímera de pruebas
        run: PGPASSWORD=hiqnet_dev psql -h localhost -U hiqnet -d postgres -c 'CREATE DATABASE hiqnet_test'
      - run: cargo test --workspace
        env:
          TEST_DATABASE_URL: postgres://hiqnet:hiqnet_dev@localhost:5432/hiqnet_test

  docker:
    name: Construir imagen (sin push)
    needs: [validate, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t "hiqnet-platform:${RELEASE_TAG}" .
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}

  release:
    name: Publicar solo al recibir un tag válido
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/platform-v')
    needs: [validate, rust, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: HiQNet Platform ${{ needs.validate.outputs.tag }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
