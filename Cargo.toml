[workspace]
resolver = "3"
members = ["crates/*", "apps/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
platform-core = { path = "crates/platform-core" }
platform-application = { path = "crates/platform-application" }
platform-storage-postgres = { path = "crates/platform-storage-postgres" }
platform-licensing = { path = "crates/platform-licensing" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "migrate",
  "macros",
  "uuid",
  "time",
  "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
argon2 = { version = "0.6", features = ["password-hash", "getrandom"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1"
dotenvy = "0.15"
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
